name: test build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip]') }}
    strategy:
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: ./crates/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@lts
      - name: install frontend deps
        run: pnpm install
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'UKMCL v__VERSION__'
          releaseBody: 'Testing Windows Side'
          releaseDraft: true
          projectPath: ./crates/frontend
          tauriScript: "pnpm tauri"
          args: ${{ matrix.args }}