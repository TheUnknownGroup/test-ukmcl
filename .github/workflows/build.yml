name: test build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip]') }}
    strategy:
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            up: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            up: "x86_64-apple-darwin"
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      working-directory: ./crates/frontend
    steps:
      - uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@lts

      - name: rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: ubuntu deps
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend deps
        run: pnpm install
        working-directory: ${{ env.working-directory }}

      - name: tauri build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.working-directory }}
          tauriScript: "pnpm tauri"
          args: ${{ matrix.args }}

      - name: release (windows)
        if: ${{ matrix.platform == 'windows-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: exe
          retention-days: 3
          path: | 
            ${{ github.workspace }}/target/release/bundle/nsis/*.exe
            ${{ github.workspace }}/target/release/bundle/msi/*.msi

      - name: release (ubuntu)
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: deb
          retention-days: 3
          path: |
            ${{ github.workspace }}/target/release/bundle/deb/*.deb
            ${{ github.workspace }}/target/release/bundle/rpm/*.rpm
            ${{ github.workspace }}/target/release/bundle/appimage/*.AppImage

      - name: release (macos)
        if: ${{ matrix.platform == 'macos-latest' && matrix.up == 'aarch64-apple-darwin'}}
        uses: actions/upload-artifact@v7
        with:
          name: dmg aarch
          retention-days: 3
          path: |
            ${{ github.workspace }}/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ github.workspace }}/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            
      - name: release (macos)
        if: ${{ matrix.platform == 'macos-latest' && matrix.up == 'x86_64-apple-darwin'}}
        uses: actions/upload-artifact@v7
        with:
          name: dmg x86
          retention-days: 3
          path: |
            ${{ github.workspace }}/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ github.workspace }}/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz
  release:
    if: ${{ contains(github.event.head_commit.message, '[re]') }}

    needs: [ build ]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: download
        uses: actions/download-artifact@v8
        with:
          path: finals
          merge-multiple: true
      - run: |
          mkdir -p final
          cd sh
          chmod +x ./move.sh
#          chmod +x ./rename.sh
          cd ../
          ./move.sh
